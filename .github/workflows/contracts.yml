name: Governed checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governed-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install contract dependencies
        run: python -m pip install ".[contract]"
      - name: Build Roslyn worker
        run: dotnet build worker/ChangeLens.Analyzer/ChangeLens.Analyzer.csproj --configuration Release
      - name: Validate contracts, snapshots and analyzer
        run: python -m unittest discover -s tests -v
