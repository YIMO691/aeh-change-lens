name: Contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wp00-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract dependencies
        run: python -m pip install ".[contract]"
      - name: Validate schemas, governance and fixtures
        run: python -m unittest discover -s tests/contract -v

